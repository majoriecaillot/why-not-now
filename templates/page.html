<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
{{head_extra}}
<link rel="icon" href="{{root}}assets/img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Karla:ital,wght@0,400;0,500;0,700;1,400&display=swap">
<link rel="stylesheet" href="{{root}}assets/css/site.css">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a class="brand" href="{{root}}"><img src="{{root}}assets/img/logo.png" alt=""><span>Why Not Now</span></a>
    <nav class="nav" aria-label="Main">
      <a class="optional" href="{{root}}#purpose">About</a>
      <a class="optional" href="{{root}}#care">End-of-life care</a>
      <a href="{{root}}blog/" aria-current="page">Blog</a>
      <a href="{{root}}#contact">Contact</a>
    </nav>
  </div>
</header>

<main>
{{content}}
</main>

<footer>
  <div class="wrap">
    <span>© {{year}} Why Not Now</span>
    <a class="text-link" href="{{root}}">Back to home</a>
  </div>
</footer>

</body>
</html>
